name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            path: build/AltDenoiserPlugin_artefacts/Release/
          - os: macos-latest
            name: macos
            path: build/AltDenoiserPlugin_artefacts/Release/
          - os: ubuntu-latest
            name: linux
            path: build/AltDenoiserPlugin_artefacts/Release/

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"

      - name: Build
        run: cmake --build build --config Release --parallel 4
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"

      - name: Verify macOS deployment target
        if: runner.os == 'macOS'
        run: |
          echo "=== Verifying macOS Mach-O deployment target ==="
          find build/AltDenoiserPlugin_artefacts/Release/ \( -name "*.component" -o -name "*.vst3" -o -name "*.app" \) | while read -r item; do
            binary=$(find "$item/Contents/MacOS" -type f 2>/dev/null | head -n 1)
            if [ -n "$binary" ]; then
              echo "Checking $binary:"
              otool -l "$binary" | grep -A 4 LC_BUILD_VERSION || true
            fi
          done

      - name: Verify non-executable stack on Linux
        if: runner.os == 'Linux'
        run: |
          echo "=== Verifying Linux shared libraries GNU_STACK permissions ==="
          find build/AltDenoiserPlugin_artefacts/Release/ -name "*.so" | while read -r so; do
            echo "Checking $so:"
            readelf -W -l "$so" | grep "GNU_STACK" || true
            if readelf -W -l "$so" | grep "GNU_STACK" | grep -q "RWE"; then
              echo "ERROR: Executable stack (RWE) detected in $so!"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alt-Denoiser-${{ matrix.name }}
          path: ${{ matrix.path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Archive artifacts for Release
        run: |
          cd artifacts
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
